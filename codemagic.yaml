workflows:
  ios-app-build:
    name: Budowa aplikacji iOS
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generowanie struktury projektu
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Budowanie pliku IPA (bez certyfikatów)
        script: |
          xcodebuild build -project "MyApp.xcodeproj" -scheme "MyApp" -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - build/ios/ipa/*.ipa
