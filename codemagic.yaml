workflows:
  ios-app-build:
    name: Budowa aplikacji iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fhi.my
    scripts:
      - name: Generowanie atrapy ikony
        script: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          cat <<EOF > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {"idiom": "iphone", "size": "60x60", "scale": "2x", "filename": "icon-120.png"},
              {"idiom": "ipad", "size": "76x76", "scale": "2x", "filename": "icon-152.png"},
              {"idiom": "ipad", "size": "83.5x83.5", "scale": "2x", "filename": "icon-167.png"},
              {"idiom": "ios-marketing", "size": "1024x1024", "scale": "1x", "filename": "icon-1024.png"}
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 --decode > temp.png
          sips -z 120 120 temp.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-120.png
          sips -z 152 152 temp.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-152.png
          sips -z 167 167 temp.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-167.png
          sips -z 1024 1024 temp.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - name: Generowanie projektu (xcodegen)
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Przypisanie profili
        script: |
          xcode-project use-profiles
      - name: Budowa aplikacji
        script: |
          xcode-project build-ipa --project "MyApp.xcodeproj" --scheme "MyApp"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
