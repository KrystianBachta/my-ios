workflows:
  ios-app-build:
    name: Budowa aplikacji iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fhi.my
    scripts:
      - name: Generowanie projektu (xcodegen)
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Przypisanie profili
        script: |
          xcode-project use-profiles
      - name: Budowa aplikacji
        script: |
          xcode-project build-ipa --project "MyApp.xcodeproj" --scheme "MyApp"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
