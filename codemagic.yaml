workflows:
  ios-app-build:
    name: Budowa aplikacji iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fhi.my
    scripts:
      - name: Przetwarzanie grafik (Ikony i Launch Screen)
        script: |
          # 1. Tworzenie folderu na ikony
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          
          # Plik konfiguracyjny dla ikon (kompletny zestaw)
          cat <<EOF > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {"idiom": "iphone", "size": "20x20", "scale": "2x", "filename": "icon-40.png"},
              {"idiom": "iphone", "size": "20x20", "scale": "3x", "filename": "icon-60.png"},
              {"idiom": "iphone", "size": "29x29", "scale": "2x", "filename": "icon-58.png"},
              {"idiom": "iphone", "size": "29x29", "scale": "3x", "filename": "icon-87.png"},
              {"idiom": "iphone", "size": "40x40", "scale": "2x", "filename": "icon-80.png"},
              {"idiom": "iphone", "size": "40x40", "scale": "3x", "filename": "icon-120.png"},
              {"idiom": "iphone", "size": "60x60", "scale": "2x", "filename": "icon-120.png"},
              {"idiom": "iphone", "size": "60x60", "scale": "3x", "filename": "icon-180.png"},
              {"idiom": "ipad", "size": "20x20", "scale": "1x", "filename": "icon-20.png"},
              {"idiom": "ipad", "size": "20x20", "scale": "2x", "filename": "icon-40.png"},
              {"idiom": "ipad", "size": "29x29", "scale": "1x", "filename": "icon-29.png"},
              {"idiom": "ipad", "size": "29x29", "scale": "2x", "filename": "icon-58.png"},
              {"idiom": "ipad", "size": "40x40", "scale": "1x", "filename": "icon-40.png"},
              {"idiom": "ipad", "size": "40x40", "scale": "2x", "filename": "icon-80.png"},
              {"idiom": "ipad", "size": "76x76", "scale": "1x", "filename": "icon-76.png"},
              {"idiom": "ipad", "size": "76x76", "scale": "2x", "filename": "icon-152.png"},
              {"idiom": "ipad", "size": "83.5x83.5", "scale": "2x", "filename": "icon-167.png"},
              {"idiom": "ios-marketing", "size": "1024x1024", "scale": "1x", "filename": "icon-1024.png"}
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF
          
          # Generowanie wszystkich rozmiarów ikon z pliku ikona_duza.png
          # iPhone
          sips -z 40 40 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-40.png
          sips -z 60 60 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-60.png
          sips -z 58 58 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-58.png
          sips -z 87 87 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-87.png
          sips -z 80 80 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-80.png
          sips -z 120 120 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-120.png
          sips -z 180 180 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-180.png
          # iPad
          sips -z 20 20 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-20.png
          sips -z 29 29 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-29.png
          sips -z 76 76 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-76.png
          sips -z 152 152 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-152.png
          sips -z 167 167 Sources/ikona_duza.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-167.png
          # App Store
          cp Sources/ikona_duza.png Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          
          # 2. Tworzenie ekranu ładowania (Launch Screen)
          mkdir -p Sources/Assets.xcassets/LaunchImage.imageset
          
          # Plik konfiguracyjny dla ekranu ładowania
          cat <<EOF > Sources/Assets.xcassets/LaunchImage.imageset/Contents.json
          {
            "images": [
              {"idiom": "universal", "scale": "1x", "filename": "launch.png"},
              {"idiom": "universal", "scale": "2x", "filename": "launch.png"},
              {"idiom": "universal", "scale": "3x", "filename": "launch.png"}
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF
          
          # Tworzenie tła ekranu ładowania (białe) o rozmiarze 2778x2778 px
          # (wystarczające dla największych iPhone'ów)
          # Używamy imagemagick, który jest dostępny na Codemagic
          magick convert -size 2778x2778 xc:white Sources/Assets.xcassets/LaunchImage.imageset/background.png
          
          # Nakładanie Twojego logo (logo_start.png) na środek tła
          if [ -f Sources/logo_start.png ]; then
            magick composite -gravity center Sources/logo_start.png Sources/Assets.xcassets/LaunchImage.imageset/background.png Sources/Assets.xcassets/LaunchImage.imageset/launch.png
          else
            # Jeśli nie dodałeś logo, tło będzie po prostu białe
            mv Sources/Assets.xcassets/LaunchImage.imageset/background.png Sources/Assets.xcassets/LaunchImage.imageset/launch.png
          fi

      - name: Generowanie projektu (xcodegen)
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Przypisanie profili
        script: |
          xcode-project use-profiles
      - name: Budowa aplikacji
        script: |
          xcode-project build-ipa --project "MyApp.xcodeproj" --scheme "MyApp"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
