workflows:
  ios-app-build:
    name: Budowa aplikacji iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fhi.my
    scripts:
      - name: Generowanie atrapy ikony
        script: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          cat <<EOF > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [{"idiom": "ios-marketing", "size": "1024x1024", "scale": "1x", "filename": "icon.png"}],
            "info": {"author": "xcode", "version": 1}
          }
          EOF
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 --decode > temp.png
          sips -z 1024 1024 temp.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon.png
      - name: Generowanie projektu (xcodegen)
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Przypisanie profili
        script: |
          xcode-project use-profiles
      - name: Budowa aplikacji
        script: |
          xcode-project build-ipa --project "MyApp.xcodeproj" --scheme "MyApp"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
